<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover：让内容延伸到刘海屏的安全区，再用 env(safe-area-inset-*) 避开
     user-scalable=no：禁止双指缩放，否则缩放后布局会错乱且退不回来 -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12100e"><!-- 移动端浏览器地址栏配色 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="app-version" content="46">
<title>我在末日独自生存</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/panels.css">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="tb-group">
      <span class="tb-stage" id="tb-stage">下水道 1-1</span>
      <span class="tb-power">战力 <b id="tb-power">0</b></span>
    </div>
    <div class="tb-group tb-bars">
      <div class="bar bar-hp"><i id="tb-hp-fill"></i><span id="tb-hp-text">0 / 0</span></div>
      <div class="bar bar-exp"><i id="tb-exp-fill"></i><span id="tb-exp-text">Lv.1</span></div>
    </div>
    <div class="tb-group tb-res">
      <span class="tb-gold">💰 <b id="tb-gold">0</b></span>
      <span class="tb-mat" id="tb-mat-a">🔩 0</span>
      <span class="tb-mat" id="tb-mat-b">🧵 0</span>
    </div>
  </header>

  <div id="build-stamp" title="如果这里显示的不是最新版本号，说明浏览器还在用缓存的旧代码">v?</div>

  <!-- 手机横屏时画布会被压成很小一条，提示竖屏使用 -->
  <div id="rotate-hint"><div>📱</div><div>请竖屏使用</div></div>

  <div id="main">

    <nav id="rail">
      <button data-panel="char"><span>👤</span><em>角色</em></button>
      <button data-panel="bag"><span>🎒</span><em>背包</em><b class="badge" id="badge-bag" hidden>0</b></button>
      <button data-panel="tech"><span>🌳</span><em>科技</em></button>
      <button data-panel="stage"><span>🗺️</span><em>关卡</em></button>
      <button data-panel="settings"><span>⚙️</span><em>设置</em></button>
    </nav>

    <div id="stage-wrap">
      <canvas id="game" width="720" height="1280"></canvas>
    </div>

    <!-- 宽屏时这里是右侧停靠栏；窄屏时它盖上整个战场，面板变成弹窗 -->
    <aside id="dock"><div id="overlay"></div></aside>

    <!-- 三选一 / 离线收益这类弹窗要盖住整个主区，不能只在右侧停靠栏里 -->
    <div id="modal-layer"></div>

  </div>

</div>

<script src="js/data/config.js"></script>
<script src="js/data/materials.js"></script>
<!-- scenes.js 必须在 protos.js 之前：protos 按场景表生成 -->
<script src="js/data/scenes.js"></script>
<!-- difficulty.js 必须在 scenes.js 之后：compOf 要读 sceneOfStage -->
<script src="js/data/difficulty.js"></script>
<script src="js/data/protos.js"></script>
<!-- sets.js 必须在 protos.js 之后：套装按 protoId 里的场景反查 -->
<script src="js/data/sets.js"></script>
<script src="js/data/affixes.js"></script>
<script src="js/data/weapons.js"></script>
<script src="js/data/tech.js"></script>
<script src="js/data/monsters.js"></script>
<script src="js/data/perks.js"></script>

<script src="js/core/eventbus.js"></script>
<script src="js/core/rng.js"></script>
<script src="js/core/formulas.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/stats.js"></script>
<script src="js/core/inventory.js"></script>
<script src="js/core/tech.js"></script>
<!-- ★ audio.js 曾经**漏在这个文件里**（漏了很久没人发现）：
     缺了它，APOC.Audio 会退化成 eventbus.js 里的空实现桩 —— 不报错、不崩溃，
     只是整个游戏从头到尾一点声音都没有。而 tools/audio_test.js 是直接加载
     audio.js 的，所以测试全绿。加 core 模块时务必同步这一个文件。 -->
<script src="js/core/audio.js"></script>
<!-- pets.js 在 stats.js / inventory.js 之后：stats.final() 调 Pets.stats() 取宠物加成，
     Inventory.autoDevour() 调 Pets.devour()。都只在运行时调用，但顺序摆对少一个坑 -->
<script src="js/core/pets.js"></script>
<script src="js/core/combat.js"></script>
<script src="js/core/arena.js"></script>
<script src="js/core/offline.js"></script>
<script src="js/core/loop.js"></script>

<!-- 音频清单：由 tools/sync_audio.py 生成。用 <script> 加载而不是 .json + fetch ——
     file:// 下双击打开时 fetch 本地文件会被 CORS 挡死，本作要保证双击能玩。
     必须排在 audio_assets.js 前面（后者 build() 时要读 APOC.AudioManifest）。 -->
<script src="assets/audio/manifest.js"></script>
<script src="js/ui/audio_assets.js"></script>

<script src="js/ui/toast.js"></script>
<script src="js/ui/effects.js"></script>
<script src="js/ui/sprites.js"></script>
<script src="js/ui/render.js"></script>
<script src="js/ui/hud.js"></script>
<script src="js/ui/panel_char.js"></script>
<script src="js/ui/panel_bag.js"></script>
<script src="js/ui/panel_tech.js"></script>
<script src="js/ui/panel_stage.js"></script>
<script src="js/ui/panel_settings.js"></script>
<script src="js/ui/panel_arena.js"></script>

<script src="js/main.js"></script>
</body>
</html>
