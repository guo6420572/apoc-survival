<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a10">
<meta name="description" content="心灯 · 人生模拟器">
<title>心灯 · 人生模拟器</title>
<style>
:root{
  --paper:#f2ede2;
  --paper-hi:#faf6ee;
  --ink:#27231d;
  --ink-soft:#4a4338;
  --muted:#8b8172;
  --line:rgba(39,35,29,.14);
  --line-strong:rgba(39,35,29,.26);
  --red:#a5432f;
  --red-soft:#bd6a56;
  --teal:#3e5a55;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}
body{min-height:100dvh;background:
  radial-gradient(1100px 760px at 18% -8%,#fcf8f0,transparent 62%),
  radial-gradient(820px 640px at 100% 0%,#eee5d5,transparent 58%),
  linear-gradient(180deg,#f4efe6,#eee7da)}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(rgba(70,52,32,.10) .6px,transparent .75px);
  background-size:3px 3px;mix-blend-mode:multiply}
::selection{background:rgba(165,67,47,.18);color:var(--ink)}
button{font-family:inherit}
.hidden{display:none!important}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;min-height:100dvh;
  padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.stage{padding:18px 16px 46px}

/* ---------- 顶部 ---------- */
.hud{position:sticky;top:0;z-index:20;background:rgba(244,239,230,.95);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
.hud-top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.age{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.04em;color:var(--ink);white-space:nowrap}
.stage-label{font-family:var(--serif);font-size:11px;color:var(--muted);letter-spacing:.18em;margin-right:auto;white-space:nowrap}
.icon-btn{width:30px;height:28px;border-radius:2px;border:1px solid var(--line-strong);
  background:transparent;color:var(--ink-soft);font-size:14px;line-height:1;cursor:pointer;flex:0 0 auto}
.icon-btn:hover{color:var(--red);border-color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);
  padding:0 8px 8px;margin-top:0}
.chip{position:relative;padding:7px 5px 6px;border-right:1px solid var(--line);background:transparent;overflow:visible}
.chip:last-child{border-right:0}
.chip em{font-style:normal;display:block;font-size:8.5px;color:var(--muted);letter-spacing:.12em}
.chip b{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.chip i{position:absolute;left:5px;right:5px;bottom:3px;height:1px;width:auto;
  background:var(--red);opacity:.55;transform:scaleX(var(--p));transform-origin:left}

/* ---------- 卡片 ---------- */
.card{position:relative;overflow:hidden;padding:26px 22px 24px;border:1px solid var(--line);
  border-radius:4px;background:rgba(255,252,246,.72);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 16px 40px rgba(70,50,25,.06)}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--red),rgba(165,67,47,.18));opacity:.85}
.kicker{position:relative;display:flex;align-items:center;gap:8px;font-size:9.5px;
  letter-spacing:.24em;color:var(--red);font-weight:600}
.kicker:before{content:"";width:5px;height:5px;background:var(--red);display:inline-block}
h1{font-family:var(--serif);font-weight:600;color:var(--ink);margin:10px 0 0;
  font-size:28px;line-height:1.42;letter-spacing:.01em}
.prose{position:relative;margin-top:20px;font-family:var(--serif);font-size:16.5px;
  line-height:2.05;color:#3f3a31}
.prose p{margin:0 0 16px;text-indent:2em}
.prose p:last-child{margin-bottom:0}
.origin-note{position:relative;display:inline-block;margin-top:18px;padding-top:10px;font-size:10px;
  letter-spacing:.18em;color:var(--red);border-top:1px solid var(--line)}

/* ---------- 选项 ---------- */
.choices{position:relative;margin-top:24px;border-top:1px solid var(--line)}
.choice{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:16px 2px;
  border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;
  color:var(--ink-soft);font-size:15px;line-height:1.68;cursor:pointer;transition:background .15s,color .15s}
.choice:hover{background:rgba(165,67,47,.045);color:var(--ink)}
.choice:active{background:rgba(165,67,47,.07)}
.choice .num{flex:0 0 20px;height:20px;border:1px solid var(--line-strong);border-radius:50%;
  display:grid;place-items:center;font-family:var(--serif);font-size:10.5px;color:var(--red);margin-top:2px}
.choice .txt{flex:1}
.choice .lock{flex:0 0 auto;font-size:9.5px;color:var(--red);border:1px solid rgba(165,67,47,.35);
  padding:2px 6px;border-radius:2px;margin-top:2px;white-space:nowrap}
.choice.locked{opacity:.35;cursor:not-allowed}
.choice.locked:hover{background:transparent;color:var(--ink-soft)}

.primary{display:block;width:100%;margin-top:24px;padding:15px;border:0;border-radius:2px;
  background:var(--ink);color:#f8f3e8;font-size:14px;font-weight:600;letter-spacing:.18em;cursor:pointer}
.primary:hover{background:#3a332a}
.primary:active{transform:none}
.ghost{display:block;width:100%;padding:13px;border:1px solid var(--line-strong);border-radius:2px;
  background:transparent;color:var(--ink-soft);font-size:13.5px;letter-spacing:.08em;cursor:pointer}
.ghost:hover{border-color:var(--red);color:var(--red)}
.linklike{display:inline-block;width:auto;align-self:center;background:none;border:0;color:var(--muted);font-size:11px;
  letter-spacing:.14em;cursor:pointer;text-align:center;padding:6px 0;text-decoration:underline;text-underline-offset:5px;
  text-decoration-color:rgba(39,35,29,.25)}
.linklike:hover{color:var(--red);text-decoration-color:var(--red)}

/* ---------- 结果 ---------- */
.deltas{position:relative;display:flex;flex-wrap:wrap;gap:14px;margin-top:20px;padding-top:14px;
  border-top:1px solid var(--line);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.delta.up{color:var(--teal)}
.delta.down{color:var(--red)}
.drift{position:relative;margin-top:22px;padding:14px 16px;border-left:2px solid var(--red);
  background:rgba(165,67,47,.035)}
.drift span{font-size:9px;letter-spacing:.22em;color:var(--red)}
.drift p{margin:6px 0 0;font-family:var(--serif);font-size:13.5px;line-height:1.9;color:var(--ink-soft);font-style:italic}

/* ---------- 封面 ---------- */
.hero{min-height:calc(100dvh - 40px);display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:40px 24px 28px}
.lamp{position:relative;width:44px;height:44px;border-radius:3px;background:var(--red);
  transform:rotate(-3deg);box-shadow:0 8px 20px rgba(120,45,30,.18);margin:0 auto 28px}
.lamp:before{content:"灯";position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--serif);font-size:26px;font-weight:600;color:#fbf6ec}
.lamp i{display:none}
.hero h1{margin:0;font-size:64px;letter-spacing:.3em;padding-left:.3em;color:var(--ink);
  font-family:var(--serif);font-weight:600;text-shadow:none}
.hero .sub{font-size:11px;letter-spacing:.5em;color:var(--muted);margin:16px 0 0;padding-left:.5em}
.hero .sub:after{content:"";display:block;width:34px;height:1px;background:var(--red);opacity:.6;margin:18px auto 0}
.hero-actions{width:100%;max-width:300px;margin-top:36px;display:flex;flex-direction:column;gap:12px}
.hero-actions .primary{margin-top:0}
.hero-actions .linklike{margin-top:2px}
.hero .fine{max-width:280px;margin:28px 0 0;font-size:10px;line-height:1.9;color:#8f8577;letter-spacing:.04em}

/* ---------- 命格 ---------- */
.origins{position:relative;margin-top:22px;border-top:1px solid var(--line)}
.origin{display:block;width:100%;text-align:left;padding:16px 2px;border:0;border-bottom:1px solid var(--line);
  border-radius:0;background:transparent;color:var(--ink-soft);cursor:pointer;transition:background .15s}
.origin:hover{background:rgba(165,67,47,.04)}
.origin b{display:block;font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink);letter-spacing:.06em}
.origin span{display:block;font-size:13px;color:var(--muted);margin-top:6px;line-height:1.8}
.origin em{display:block;font-style:normal;font-size:10.5px;color:var(--red);margin-top:9px;letter-spacing:.06em}

/* ---------- 结局 ---------- */
.ending{padding-top:28px}
.end-title{font-size:38px;letter-spacing:.1em;color:var(--ink);line-height:1.32}
.stamp{position:relative;display:inline-block;margin-top:18px;padding:4px 9px;border:1px solid var(--red);
  color:var(--red);font-size:9.5px;letter-spacing:.2em;border-radius:2px}
.quote{position:relative;margin-top:24px;padding-left:14px;border-left:2px solid var(--red);
  font-family:var(--serif);font-size:13.5px;line-height:1.9;color:var(--ink-soft)}
.final-stats{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin-top:24px;
  border-top:1px solid var(--line);border-left:1px solid var(--line)}
.fstat{padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent}
.fstat em{display:block;font-style:normal;font-size:9px;color:var(--muted);letter-spacing:.14em}
.fstat b{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.fstat i{display:none}
.persona,.chartfinal{position:relative;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.persona h3,.chartfinal h3{font-size:9.5px;letter-spacing:.22em;color:var(--muted);font-weight:500;margin:0}
.type{font-family:var(--serif);font-size:34px;letter-spacing:.14em;color:var(--ink);margin-top:8px;font-weight:600}
.persona p,.chartfinal p{margin:10px 0 0;font-family:var(--serif);font-size:13.5px;line-height:1.95;color:var(--ink-soft)}
.chartfinal p{margin-top:8px}
.end-actions{position:relative;margin-top:28px}
.end-actions .row{display:flex;gap:10px;margin-top:10px}
.end-actions .row .ghost{flex:1}

/* ---------- 弹窗 ---------- */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
  padding:16px;background:rgba(39,35,29,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal-card{position:relative;width:100%;max-width:560px;max-height:84dvh;overflow:auto;
  padding:24px 20px calc(22px + env(safe-area-inset-bottom));border-radius:4px;
  border:1px solid var(--line-strong);background:#faf6ee;box-shadow:0 30px 80px rgba(50,35,20,.22)}
@media(min-width:720px){.modal{align-items:center}}
.modal-x{position:absolute;right:12px;top:10px;width:32px;height:32px;border-radius:50%;
  border:1px solid var(--line);background:transparent;color:var(--muted);font-size:17px;line-height:1;cursor:pointer}
.modal-x:hover{color:var(--red);border-color:var(--red)}
.modal-head h2{margin:0;font-family:var(--serif);font-size:22px;font-weight:600;color:var(--ink);letter-spacing:.06em}
.modal-head p{margin:6px 0 0;font-size:10.5px;letter-spacing:.16em;color:var(--muted)}
.menu{display:flex;flex-direction:column;margin-top:18px;border-top:1px solid var(--line)}
.menu button{padding:14px 2px;border:0;border-bottom:1px solid var(--line);border-radius:0;
  background:transparent;color:var(--ink-soft);font-size:15px;text-align:left;cursor:pointer}
.menu button:hover{color:var(--red)}
.menu button.danger{color:var(--red)}
.help p{margin:14px 0 0;font-size:14px;line-height:1.9;color:var(--ink-soft)}
.gallery{margin-top:8px}
.g-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.g-i{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.08em}
.g-t b{display:block;font-family:var(--serif);font-size:15px;font-weight:600;color:var(--ink);letter-spacing:.04em}
.g-t span{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
.g-row.off{opacity:.35}

/* ---------- 提示 ---------- */
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,12px);
  z-index:80;padding:10px 18px;border-radius:2px;background:var(--ink);border:1px solid var(--ink);
  color:#f8f3e8;font-size:12.5px;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 动效 ---------- */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.enter{animation:rise .42s ease both}
@media (prefers-reduced-motion:reduce){.enter{animation:none}html{scroll-behavior:auto}}
@media (max-width:360px){
  .stats{padding-left:4px;padding-right:4px}
  .chip em{font-size:8px}
  .chip b{font-size:14px}
  .age{font-size:18px}
  .hero h1{font-size:52px}
  .hero-actions{max-width:280px}
  .card{padding:22px 18px 20px}
  h1{font-size:25px}
  .prose{font-size:16px}
  .choice{font-size:14.5px;padding:14px 2px}
  .end-title{font-size:32px}
  .type{font-size:30px}
  .modal{padding:10px}
}
@media (min-width:720px){
  .stage{padding:24px 24px 56px}
  .hero h1{font-size:74px}
  .lamp{width:48px;height:48px}
  .lamp:before{font-size:28px}
  .card{padding:32px 30px 28px}
  h1{font-size:30px}
  .prose{font-size:17px}
  .end-title{font-size:44px}
}

</style>
</head>
<body>
<div id="app">
  <header id="hud" class="hud hidden">
    <div class="hud-top">
      <div class="age" id="ageLabel">初生</div>
      <div class="stage-label" id="stageLabel"></div>
      <button class="icon-btn" id="menuBtn" aria-label="菜单">···</button>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <main id="stage" class="stage" aria-live="polite"></main>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-card">
    <button class="modal-x" id="modalClose" aria-label="关闭">×</button>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast" class="toast" role="status"></div>

<script>
'use strict';

/* ===================== 基础 ===================== */
const SAVE_KEY='xr_life_v3';
const END_KEY='xr_life_v3_endings';
const RUN_KEY='xr_life_v3_runs';
const $=s=>document.querySelector(s);
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const STAT_NAMES={heart:'心灯',grit:'韧性',career:'生计',ties:'人情',body:'身体',fate:'缘分'};
const DELTA_ORDER=['heart','grit','career','ties','body','fate'];
const CN=['零','一','二','三','四','五','六','七','八','九'];
function cnAge(n){
  if(n===0)return '初生';
  if(n<10)return CN[n]+'岁';
  if(n<20)return '十'+(n%10?CN[n%10]:'')+'岁';
  if(n===30)return '三十岁';
  return CN[Math.floor(n/10)]+'十'+(n%10?CN[n%10]:'')+'岁';
}
function shuffle(a){
  const x=a.slice();
  for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}
  return x;
}
function goTop(){window.scrollTo({top:0,behavior:'smooth'});}

const BIRTH={base:{metal:4,earth:4,water:2,fire:1,wood:1}};
const EL_MAP={i:'water',e:'fire',s:'earth',n:'wood',t:'metal',f:'fire',j:'metal',p:'wood'};

/* ===================== 命格 ===================== */
const ORIGINS=[
  {id:'early',name:'早熟',desc:'你很小就学会看人脸色。',bonus:{heart:8,body:-5}},
  {id:'stubborn',name:'倔',desc:'你不轻易低头，也不轻易原谅。',bonus:{grit:12,ties:-6}},
  {id:'likable',name:'讨喜',desc:'你笑一笑，大人就不好再说什么。',bonus:{ties:12,heart:2}},
  {id:'memory',name:'记性好',desc:'你记得每一笔账，也记得每一句难听的话。',bonus:{career:8,heart:-3}},
  {id:'soft',name:'心软',desc:'你见不得别人为难，哪怕为难的是自己。',bonus:{heart:12,grit:-6}},
  {id:'seachild',name:'海边的孩子',desc:'台风天你也敢往家跑。',bonus:{body:10,grit:4}},
  {id:'quiet',name:'寡言',desc:'你把话咽下去，自己消化。',bonus:{grit:6,ties:-3,heart:4}}
];
function originName(id){const o=ORIGINS.find(x=>x.id===id);return o?o.name:'';}
function bonusText(b){return Object.entries(b).map(([k,v])=>STAT_NAMES[k]+' '+(v>0?'+':'')+v).join(' · ');}
function pickOrigins(){return shuffle(ORIGINS).slice(0,3);}

/* ===================== 主线 ===================== */
const MAIN=[
{id:'born',age:0,year:1997,stage:'序章 · 湛江',title:'你出生那天，海上有雾',auto:'睁开眼睛',
 autoDrift:'你来到这个家。',
 text:[
  '湛江。海风把竹竿上的衣服吹得笔直。你出生在一间会漏雨的屋子里。',
  '你名字里有一个字，拆开是矛加木。表面锋利，内心柔软；一根筋，不知道变通。',
  '你还有一个名字，和五行有关，从来没用过。'
 ]},

{id:'e1',age:6,year:2002,stage:'第一章 · 寄居',title:'多夹了一块鸡',
 text:[
  '你寄住在亲戚家。你小时候父母就分开了，借宿在各个亲戚那里。',
  '饭桌上有一盘白切鸡，姜葱切得很细。你伸筷子多夹了一块。亲戚看了你一眼：“女孩子家，吃那么多做什么。”桌边的人都停了筷子。'
 ],
 choices:[
  {label:'把鸡放回盘子，低头扒饭',eff:{heart:2,body:-2},istj:{i:2,t:1,j:1},drift:'你学会了在别人家，先看别人的脸色。',res:'你把那块鸡放回去，酱汁在碗边蹭出一道印子。那顿饭你吃得很慢。'},
  {label:'看着她的眼睛，说“我妈给过伙食费”',eff:{grit:8,ties:-5},istj:{e:2,t:1},drift:'你偶尔也把话说出口，哪怕代价是冷场。',res:'桌上安静了几秒。亲戚笑了一声，说这孩子嘴厉害。那天晚上妈妈来接你，你什么都没说。'},
  {label:'把鸡夹给表弟，自己喝汤',eff:{heart:6,body:-1},istj:{t:1,j:1,f:1},kind:true,drift:'你心软了一下，把自己的那份让了出去。',res:'表弟吃得满嘴油。亲戚的脸色缓下来，给你添了一勺汤。你捧着碗，心里有点酸，也有点踏实。'}
 ]},

{id:'e2',age:7,year:2003,stage:'第一章 · 寄居',title:'计算器响到很晚',
 text:[
  '妈妈在灯下算账，计算器按得很慢，按错了就全部清零重来。你躺在床上装睡，听见她叹了一口气。',
  '桌上摊着学费单、房租单，还有一张写了一半的借条。'
 ],
 choices:[
  {label:'起来给她倒一杯热水',eff:{heart:7,body:1},istj:{f:1,i:1},kind:true,drift:'你开始学着照顾人，哪怕自己也很小。',res:'她愣了一下，接过杯子，说“怎么还没睡”。你说睡不着。她把你搂过去，身上的衣服有洗衣粉和汗的味道。'},
  {label:'继续装睡，心里发誓要挣很多钱',eff:{grit:6,career:4},istj:{t:2,j:2},drift:'你把一个数字记在心里，决定以后靠自己。',res:'你闭着眼，把那个数字记在心里。很多年后你真的挣到了钱，可那晚的叹气声，你一直没忘。'},
  {label:'问她“我们是不是很穷”',eff:{heart:4,grit:5},istj:{t:1,f:1},drift:'你第一次知道，大人的沉默里有东西。',res:'她沉默了很久，说“不穷，有你在”。你看见她把脸转过去，肩膀轻轻抖了一下。'}
 ]},

{id:'e3',age:9,year:2005,stage:'第一章 · 寄居',title:'八十块钱',
 text:[
  '学校要交八十块资料费。亲戚说：“找你妈去。”妈妈在厂里上班，传呼机回不了。',
  '你站在校门口，书包带子勒着肩膀。'
 ],
 choices:[
  {label:'自己走四十分钟回家，没跟妈妈开口',eff:{grit:7,body:-4},istj:{i:2,s:1,j:1},drift:'你更习惯自己解决，不开口。',res:'你走了很久，鞋底磨得发热。到家后你把通知单藏在课本里。第二天老师说可以缓交，你松了一口气，又有点想哭。'},
  {label:'找同学借，答应帮她值日一周',eff:{ties:6,heart:3},istj:{f:1,e:1},drift:'你学会了欠人情要还，还得清清楚楚。',res:'同学借给你钱，你把值日排得整整齐齐。那一周你每天最后一个走，教室的灯是你关的。'},
  {label:'跟老师说家里困难，不交了',eff:{heart:3,grit:4,ties:2},istj:{i:1,t:1},drift:'你不再觉得求助是丢脸，只是累。',res:'老师看了你一眼，把单子收回去，说“知道了”。你没有觉得丢脸，只觉得累。'}
 ]},

{id:'e4',age:11,year:2007,stage:'第一章 · 寄居',title:'过年的那张嘴',
 text:[
  '父母正式分开。过年，你跟着妈妈去亲戚家。饭吃到一半，有人说：“没爸的孩子，以后可怎么办哦。”',
  '你记得的不是那桌菜，是那些嘴脸。妈妈握着筷子的手停了一下。'
 ],
 choices:[
  {label:'把碗一放，回房间',eff:{grit:5,ties:-4},istj:{i:2,j:1},drift:'你把门关上，把话留在外面。',res:'门关上的时候，你听见外面有人说“脾气还挺大”。你坐在床边，把眼泪憋回去。'},
  {label:'笑着说“我有妈妈”',eff:{heart:7,grit:5},istj:{t:2,j:1},kind:true,drift:'你学会了用一句轻的话，挡住一把刀。',res:'桌上静了一下。妈妈低下头，给你夹了一块鱼。回家的路上她没说话，只把你的手攥得很紧。'},
  {label:'低头把饭吃完，一句话没说',eff:{heart:-2,body:-3,grit:3},istj:{i:2,t:1},drift:'你学会了在难听的话里保持安静。',res:'你把碗里的饭一粒一粒吃完。那顿饭很长。后来你学会了在难听的话里保持安静。'}
 ]},

{id:'e5',age:12,year:2008,stage:'第一章 · 寄居',title:'木弱',
 text:[
  '镇上来了个算命先生。妈妈把你的生辰报给他。他排了半天，说：“金多，做事细；火少，话不多；木弱，很多事得靠自己长。”',
  '他指着最后一柱：“这一柱，我算不出来。”妈妈问是好是坏。他说：“看她自己。”',
  '你记住了“木弱”。很多年后，你说：我缺木。',
  '他临走时又说了一句：“等有一天，有人送她一棵树。”你问什么意思。他笑笑，说：“到时候你就知道了。”'
 ],
 choices:[
  {label:'问“那我以后会好吗”',eff:{heart:3,fate:2},istj:{n:2,f:1},drift:'你开始相信，命里有些东西是预先写好的。',res:'他看了你一眼，说：“命里没有写死的事。你记住这句话就行。”你点点头，没太懂。'},
  {label:'把生辰记在本子上，想以后自己算',eff:{career:3,grit:2},istj:{t:2,j:2},drift:'你把那张纸当成一道题，想以后自己算。',res:'你回家把生辰写在作业本最后一页。后来你查过很多次，每次都在“木弱”那一行停住。'},
  {label:'跑出去看海',eff:{heart:2,body:3},istj:{e:2,s:1},drift:'你不想被一张纸说完，跑出去吹了会儿风。',res:'你跑到海堤上，风很大。你对着海喊了一声，没人听见。'}
 ]},

{id:'e6',age:13,year:2009,stage:'第一章 · 寄居',title:'第七次搬家',auto:'把纸箱抱起来',
 autoDrift:'你更习惯把家背在身上。',
 text:[
  '妈妈拖着一个编织袋，你抱着一个纸箱。纸箱里是课本、一个掉漆的铁盒，和一只缺了耳朵的布兔子。',
  '你们从湛江的一头搬到另一头。新家的窗户对着别人家的墙。妈妈把床单铺好，说：“以后会好的。”'
 ]},

{id:'e7',age:14,year:2010,stage:'第二章 · 长大',title:'沙坑',
 text:[
  '课间，男生笑你“没爸的孩子”。你把他推倒在沙坑里，沙子进了他的领口。',
  '你想起小时候摔过一次，差点掉进河里。你也没哭。老师叫家长，妈妈从厂里请假赶来，鞋上还有没擦干净的灰。'
 ],
 choices:[
  {label:'跟妈妈道歉，也跟同学道歉',eff:{heart:7,ties:5},istj:{t:1,j:1,f:1},kind:true,drift:'你学会了低头，也学会了不让人难堪。',res:'你说“对不起”的时候，声音很小。妈妈摸了摸你的头。回家的路上她给你买了一根冰棍。'},
  {label:'不道歉，觉得他活该',eff:{grit:7,ties:-5},istj:{t:2,j:1},drift:'你宁愿硬着，也不肯认错。',res:'你站着，一句话不说。妈妈替你道了歉，拉着你走出办公室。她的手很凉，一路都没松开。'},
  {label:'妈妈道歉的时候，你突然哭了',eff:{heart:6,body:-2},istj:{f:2},drift:'你第一次知道，有些委屈最后是妈妈替你受的。',res:'你哭得停不下来。妈妈一边给你擦眼泪，一边跟老师赔笑。'}
 ]},

{id:'e8',age:15,year:2011,stage:'第二章 · 长大',title:'摩羯那一页',
 text:[
  '班里的女生在聊星座。有人说：“摩羯座的人，天生会忍。”',
  '你回家翻出一本旧杂志，找到摩羯那一页：土象星座，土星守。慢热，认死理，怕欠人情。',
  '你不信。你只是觉得，这些词像有人偷偷看过你。你秩序性很强。'
 ],
 choices:[
  {label:'把那一页撕下来，夹进课本',eff:{heart:2},istj:{i:2,s:1},drift:'你开始用一个星座，解释自己。',res:'你把那一页夹在语文课本里。后来你发现，自己确实喜欢把东西排整齐。'},
  {label:'跟同学说“星座都是骗人的”',eff:{grit:3},istj:{t:2,e:1},drift:'你不喜欢被人一眼看穿。',res:'同学笑你嘴硬。你也笑。回家后你偷偷把那一页看完了。'},
  {label:'对着杂志上的摩羯，发了会儿呆',eff:{heart:2,fate:2},istj:{i:2,n:1},drift:'你心里有个地方，被说中了。',res:'你看着“慢热，认死理，怕欠人情”那几行字，想起自己在亲戚家吃饭的样子。'}
 ]},

{id:'e9',age:16,year:2012,stage:'第二章 · 长大',title:'姐姐',
 text:[
  '弟弟出生后，家里的钱更紧。亲戚说：“你是姐姐，要让着弟弟。”',
  '新书包给了弟弟。你的书包洗了洗，继续背。'
 ],
 choices:[
  {label:'把新书包让给弟弟，自己用旧的',eff:{heart:5,body:-2},istj:{f:1},kind:true,drift:'你学会了让。让久了，就忘了自己想要什么。',res:'弟弟背着新书包在镜子前转圈。你站在门口看了一会儿，回房间把自己的旧书包刷干净。'},
  {label:'说“我也要读书”',eff:{grit:7,ties:-4},istj:{t:2,j:1},drift:'你第一次为自己争。',res:'亲戚说你自私。妈妈没说话，第二天多接了一份零工。你听见她半夜咳嗽，把被子蒙住了头。'},
  {label:'把家里的每一笔开销记在本子上',eff:{career:5,grit:5},istj:{t:1,j:1,s:1},drift:'你把家里的每一笔开销记下来，像在给自己找一条路。',res:'你买了一个一块钱的本子，把菜钱、学费、弟弟的奶粉钱一笔一笔记下来。'}
 ]},

{id:'e10',age:18,year:2014,stage:'第二章 · 长大',title:'不读了',
 text:[
  '你不读了。书没念完，你就不想念了。',
  '亲戚问起来，你还没想好怎么说。'
 ],
 choices:[
  {label:'说“没考上”',eff:{heart:2,ties:2},istj:{f:1,i:1},drift:'你学会了用一句别人能接受的话，把事挡过去。',res:'你说没考上。亲戚叹气，说女孩子读那么多书没用。你没接话。其实你也没怎么考。'},
  {label:'说“不想读”',eff:{grit:4,ties:-3},istj:{t:1,j:1},drift:'你不想再替自己编一个体面的理由。',res:'亲戚说你任性。妈妈没说话，第二天多接了一份零工。'},
  {label:'不解释',eff:{heart:1,grit:2},istj:{i:2,t:1},drift:'你把话咽下去，自己走。',res:'你什么都不说。他们问了几句，也就不问了。'}
 ]},

{id:'e11',age:18,year:2014,stage:'第二章 · 长大',title:'漂流瓶',
 text:[
  '2014年，你在微信里玩漂流瓶。你发了一句歌词。',
  '一个陌生人捡到了，回你：这首歌我也听过。'
 ],
 choices:[
  {label:'回他',eff:{fate:12,ties:2},istj:{f:1,e:1},drift:'你回了一句。你不知道，这个人会留很多年。',res:'你们从歌词聊到天亮。后来加了好友。'},
  {label:'不理',eff:{fate:6,body:3},istj:{i:2,s:1},drift:'你把手机放下。第二天，那个漂流瓶又漂回来了。',res:'你关了手机，去睡觉。第二天打开，那个陌生人又发来一句：昨晚那首歌，我也单曲循环过。'},
  {label:'聊到天亮',eff:{fate:18,body:-3},istj:{e:2,n:1},drift:'你允许一个陌生人，走进来一点。',res:'你们聊到天亮。他说他在山东。后来加了好友。十二年后，这个人还在。'}
 ]},

{id:'e12',age:19,year:2015,stage:'第三章 · 出走',title:'奶茶店',
 text:[
  '你去了青岛。在一家奶茶店做店员。摇杯子，封口，擦台。海风很咸，住处的墙很薄。',
  '店里有个大叔问你多高。你说一米六几。他说他一米七四。你说，那我也一米七四。'
 ],
 choices:[
  {label:'一个人去海边',eff:{heart:4,body:2},istj:{i:2,s:1},kind:true,drift:'你开始享受一个人的路。',res:'你一个人去了海边。海风很咸。你觉得一个人出门还好；约着人，就要顾大家的心情，没那么美好。'},
  {label:'给家里打电话',eff:{ties:5,heart:3},istj:{f:2},drift:'你学会了报喜不报忧。',res:'你给妈妈打电话，说青岛挺好的。她问钱够不够，你说够。挂了电话，你看了看钱包。'},
  {label:'多上一个班',eff:{career:5,body:-4},istj:{t:2,j:2},drift:'你把时间换成了钱，也换成了底气。',res:'你多上了一个班。店里的冰柜嗡嗡响。你把每一笔钱记在本子上。'}
 ]},

{id:'e13',age:21,year:2017,stage:'第三章 · 出走',title:'月饼',
 text:[
  '你去了广州。还是奶茶店。',
  '中秋，老板发工资，发了一些散装没蛋黄的月饼。工资可低了。'
 ],
 choices:[
  {label:'收下月饼',eff:{heart:2,ties:2},istj:{f:1},drift:'你把话咽下去，把月饼收好。',res:'你把月饼收下。工资低，你也没说什么。晚上回去，你把月饼掰开，果然没有蛋黄。'},
  {label:'去问工资',eff:{grit:4,career:3,ties:-3},istj:{t:2,j:1},drift:'你学会了自己去问，不等人给。',res:'你去问工资。老板说，现在都不好混。你回到吧台，继续摇杯子。'},
  {label:'把月饼分给同事',eff:{ties:4,heart:3},istj:{f:1,e:1},kind:true,drift:'你不想一个人占这点便宜。',res:'你把月饼分给同事。他们笑，说你会做人。你说，反正也没蛋黄。'}
 ]},

{id:'e14',age:22,year:2018,stage:'第三章 · 出走',title:'像个机器人',
 text:[
  '你在奶茶店站了两年。同事说你像个机器人：封口永远对齐，台面永远干净，交班前还要把单子对一遍。',
  '你没有生气。你喜欢观察人类，不喜欢接触。你也问自己：我是不是有点刻板了？'
 ],
 choices:[
  {label:'把这句话当成夸奖',eff:{career:4,grit:3},istj:{t:2,j:2},drift:'你开始相信，可靠比讨喜重要。',res:'你继续把封口对齐。你说：我工作很认真尽责，哪怕最后一天也要完美收工。'},
  {label:'试着跟同事去吃饭',eff:{ties:5,career:-2},istj:{e:2,f:1},drift:'你试着走近人群，回来以后更确定自己适合一个人。',res:'你去了。饭桌上大家聊综艺，你插不上话，只负责倒茶。回家的路上，你松了一口气。'},
  {label:'第二天把台面擦得更干净',eff:{career:4,body:-2},istj:{t:2,j:1,s:1},drift:'你给自己又加了一条规矩。',res:'你把台面擦得更干净。交班的人说，跟你搭班最省心。'}
 ]},

{id:'e15',age:23,year:2019,stage:'第三章 · 出走',title:'回湛江',
 text:[
  '你回湛江。没有正经工作，有一搭没一搭做兼职。',
  '你和弟弟、弟弟的女朋友住在一个屋檐下。'
 ],
 choices:[
  {label:'做兼职',eff:{career:5,heart:3,ties:3},istj:{f:1,s:1},kind:true,drift:'你学会了有一搭没一搭地，把日子接上。',res:'你接了一份兼职。工资可低了。你也没指望它发财。'},
  {label:'出去玩',eff:{heart:4,body:2,career:-3},istj:{n:1,f:1},drift:'钱一到手，你就想往外走。',res:'你拿着刚发的钱，买了一张车票，出去玩了一圈。回来以后，钱没了，人松了。'},
  {label:'在家陪妈妈',eff:{ties:5,heart:4,career:-3},istj:{f:2},kind:true,drift:'你把“陪”当成了自己的责任。',res:'你在家陪妈妈。她嘴上嫌你烦，饭却做得比平时丰盛。'}
 ]},

{id:'e16',age:24,year:2020,stage:'第三章 · 出走',title:'合适',
 text:[
  '亲戚给你安排相亲。对方条件不错。见面第三次，对方问：你什么学历，一个月挣多少，以后能不能顾家。',
  '你说：学渣，兼职，顾不了。你不生。你觉得你无法负责；恋爱和婚姻都只是一个阶段；结婚证约束不了什么。'
 ],
 choices:[
  {label:'说“不合适”，起身走了',eff:{heart:4,grit:4,ties:-4},istj:{t:2,j:2},drift:'你给自己定了一条规矩：不将就。',res:'你买了单，走出茶楼。亲戚说你挑。你没有解释。那天晚上，你一个人去海堤坐了很久。'},
  {label:'继续相处，看看能不能习惯',eff:{ties:5,heart:-2},istj:{s:2,f:1},drift:'你试着把日子过成别人期待的样子。',res:'你们相处了半年。对方记得你的生日，也会来接你下班。可你每次说“好”的时候，心里都空一小块。最后你还是说了不合适。'},
  {label:'拿工作当借口',eff:{career:3,heart:-1},istj:{i:2,t:1},drift:'你拿工作当借口，把话题挡了回去。',res:'你说最近太忙，过一阵再说。媒人叹口气，说你这孩子。你笑笑，把茶喝完。'}
 ]},

{id:'e17',age:25,year:2021,stage:'第三章 · 出走',title:'钱一到手',
 text:[
  '你没存下什么钱。兼职的钱一到手，你就想出去。北海、潮汕、南昌、云南。',
  '你喜欢自己来。独处就满血。你喜欢逛菜市场和超市。'
 ],
 choices:[
  {label:'去旅行',eff:{heart:5,body:2,career:-2},istj:{n:2,f:1},kind:true,drift:'你把自己放到了路上。',res:'你一个人去了。你在海边吃无花果，在潮汕吃牛肉，在南昌被辣哭。你说：一个人出去旅游，也很不赖。'},
  {label:'吃一顿好的',eff:{heart:4,body:1},istj:{f:1,s:1},kind:true,drift:'你把钱花在了嘴里，也花在了当下。',res:'你去吃了一顿好的。白切鸡、薄粉、鱼仔汤。吃完在街上走了很久。'},
  {label:'存起来',eff:{career:5,heart:-2},istj:{t:2,j:2},drift:'你把钱存起来，把想去的远方往后放。',res:'你把钱存起来。晚上刷到别人旅行的视频，看了一会儿。'}
 ]},

{id:'e18',age:26,year:2022,stage:'第四章 · 立身',title:'把脉',
 text:[
  '你最近睡不好，眼睛干，掉发。你给自己把脉，摸半天，摸不出个所以然。',
  '你经常研究自己。'
 ],
 choices:[
  {label:'去医院',eff:{body:6,career:-3},istj:{j:1,s:1},drift:'你把手头的事放下，先去了医院。',res:'你去了医院。医生说：别熬夜。你点头，像小时候听老师话。'},
  {label:'自己调理',eff:{heart:3,body:2},istj:{f:1,s:1},drift:'你给自己煮了酸枣仁，早睡了一周。',res:'你给自己煮了酸枣仁，早睡了一周。眼睛还是干，但没那么慌了。'},
  {label:'做蛋挞，早点睡',eff:{heart:4,body:4},istj:{f:1,s:1},kind:true,drift:'你开始学着把自己也照顾进去。',res:'你半夜睡不着，起来做蛋挞。烤箱亮着，屋里很暖。你吃了两个，把剩下的放进冰箱。'}
 ]},

{id:'e19',age:26,year:2022,stage:'第四章 · 立身',title:'我缺木',
 text:[
  '你找了一个会排盘的师傅，把自己的生辰报过去。他说：“金多，火有点，木弱。”你说：我缺木。',
  '你还有一个名字，和五行有关，从来没用过。你把“柔”拆开：矛加木。表面锋利，内心柔软；一根筋，不知道变通。',
  '你这两年疯狂迷恋无花果，去年差点为了它跑威海去。你说：我想要果，但我又懒得种。',

const EVENTS={};

/* ===================== 排程 ===================== */
function buildPlan(){
  const plan=MAIN.map(e=>({id:e.id,age:e.age,year:e.year,gz:e.gz,stage:e.stage}));
  const used=new Set();
  const bands=[[1,6],[7,11],[12,16],[17,21],[22,25],[26,29]];
  for(let b=bands.length-1;b>=0;b--){
    const lo=bands[b][0],hi=bands[b][1];
    const idx=lo+Math.floor(Math.random()*(hi-lo+1));
    const host=plan[idx];
    if(!host)continue;
    const eligible=RANDOM.filter(r=>!used.has(r.id)&&host.age>=r.minAge);
    if(!eligible.length)continue;
    const ev=eligible[Math.floor(Math.random()*eligible.length)];
    used.add(ev.id);
    plan.splice(idx+1,0,{id:ev.id,age:host.age,year:host.year,gz:host.gz,stage:host.stage,random:true});
  }
  return plan;
}

/* ===================== 状态 ===================== */
let state=null;

function newState(origin){
  const stats={heart:55,grit:50,career:15,ties:40,body:70,fate:0};
  for(const [k,v] of Object.entries(origin.bonus||{}))stats[k]=clamp(stats[k]+v);
  let run=1;
  try{run=(parseInt(localStorage.getItem(RUN_KEY)||'0',10)||0)+1;localStorage.setItem(RUN_KEY,String(run));}catch(e){run=1;}
  return {
    v:3,origin:origin.id,run,pos:0,age:0,year:1997,stats,
    axes:{i:6,s:4,t:6,j:7,e:2,n:2,f:4,p:2},
    elements:{...BIRTH.base},
    flags:{},his:0,kind:0,shortcuts:0,
    log:[],plan:buildPlan(),started:Date.now(),ending:null,dead:false
  };
}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch(e){}}
function loadSave(){
  try{
    const s=JSON.parse(localStorage.getItem(SAVE_KEY));
    if(s&&s.v===3&&Array.isArray(s.plan)&&!s.ending)return s;
  }catch(e){}
  return null;
}
function loadEndings(){
  try{const a=JSON.parse(localStorage.getItem(END_KEY)||'[]');return Array.isArray(a)?a.filter(id=>GALLERY_ORDER.includes(id)):[];}catch(e){return [];}
}
function unlockEnding(id){
  const a=loadEndings();
  if(a.includes(id))return false;
  a.push(id);
  try{localStorage.setItem(END_KEY,JSON.stringify(a));}catch(e){}
  return true;
}
function currentItem(){return state.plan[state.pos];}

/* ===================== 命理 / 性格 ===================== */
function axesFromChoice(c){
  if(c.istj)return c.istj;
  const e=c.eff||{};
  const a={};
  const add=(k,v)=>{a[k]=(a[k]||0)+v;};
  if((e.heart||0)>0){add('f',1);add('i',1);}
  if((e.heart||0)<0){add('t',1);add('j',1);}
  if((e.grit||0)>0){add('t',1);add('j',1);}
  if((e.career||0)>0){add('t',1);add('j',1);add('s',1);}
  if((e.ties||0)>0){add('e',1);add('f',1);}
  if((e.ties||0)<0){add('i',1);}
  if((e.body||0)<0){add('s',1);add('j',1);}
  if((e.fate||0)>0){add('f',1);add('n',1);}
  if(c.kind){add('f',1);add('e',1);}
  return a;
}

function driftLine(ax,seed){
  let best='i',bv=0;
  for(const [k,v] of Object.entries(ax)){if(v>bv){bv=v;best=k;}}
  const arr=DRIFT[best]||DRIFT.i;
  return arr[seed%arr.length];
}
function mbti(){
  const a=state.axes;
  const p=(x,y)=>Math.max(1,Math.min(99,Math.round(50+(x-y)*2.2)));
  const I=p(a.i,a.e),S=p(a.s,a.n),T=p(a.t,a.f),J=p(a.j,a.p);
  return {I,E:100-I,S,N:100-S,T,F:100-T,J,P:100-J,
    type:(I>=50?'I':'E')+(S>=50?'S':'N')+(T>=50?'T':'F')+(J>=50?'J':'P')};
}

function renderEvent(){
  const item=currentItem();
  if(!item){showEnding();return;}
  const ev=EVENTS[item.id];
  state.age=item.age;
  state.year=item.year;
  save();
  renderHUD();
  let h='<section class="card enter">'+
    '<div class="kicker">'+item.stage+'</div>'+
    '<h1>'+ev.title+'</h1>'+
    '<div class="prose">'+ev.text.map(p=>'<p>'+p+'</p>').join('')+'</div>';
  if(ev.id==='born'){
    h+='<div class="origin-note">命格 · '+originName(state.origin)+'</div>';
  }
  if(ev.autoDrift){
    h+='<div class="drift"><span>性格的偏移</span><p>'+ev.autoDrift+'</p></div>';
  }
  if(ev.choices&&ev.choices.length){
    h+='<div class="choices">'+ev.choices.map((c,i)=>{
      const locked=c.req&&(state.stats[c.req.stat]||0)<c.req.val;
      return '<button class="choice'+(locked?' locked':'')+'" data-i="'+i+'"'+(locked?' disabled':'')+'>'+
        '<span class="num">'+((['一','二','三','四'][i])||(i+1))+'</span>'+
        '<span class="txt">'+c.label+'</span>'+
        (locked?'<span class="lock">心灯不足</span>':'')+
      '</button>';
    }).join('')+'</div>';
  }else{
    h+='<button class="primary" id="nextBtn">'+(ev.auto||'继续')+'</button>';
  }
  h+='</section>';
  $('#stage').innerHTML=h;
  if(ev.choices&&ev.choices.length){
    $('#stage').querySelectorAll('.choice').forEach(btn=>{
      btn.addEventListener('click',()=>choose(Number(btn.dataset.i)));
    });
  }else{
    $('#nextBtn').onclick=advance;
  }
  goTop();
}

function choose(i){
  const item=currentItem();
  const ev=EVENTS[item.id];
  const c=ev.choices[i];
  if(!c)return;
  if(c.req&&(state.stats[c.req.stat]||0)<c.req.val)return;
  const before={...state.stats};
  if(c.eff){
    for(const [k,v] of Object.entries(c.eff))state.stats[k]=clamp((state.stats[k]||0)+v);
  }
  if(c.flags)Object.assign(state.flags,c.flags);
  if(c.flags&&c.flags.shortcut)state.shortcuts=(state.shortcuts||0)+1;
  if(c.kind)state.kind+=1;
  if(c.his)state.his+=c.his;
  const ax=axesFromChoice(c);
  for(const [k,v] of Object.entries(ax)){
    state.axes[k]=(state.axes[k]||0)+v;
    const el=EL_MAP[k];
    if(el)state.elements[el]=(state.elements[el]||0)+v;
  }
  const drift=c.drift||driftLine(ax,state.log.length);
  state.log.push({age:item.age,title:ev.title,choice:c.label,drift,flags:c.flags?Object.keys(c.flags):[]});
  if(state.stats.body<=0)state.dead=true;
  save();
  renderResult(ev,c,before,drift);
}

function renderResult(ev,c,before,drift){
  const s=state.stats;
  const deltas=DELTA_ORDER.filter(k=>s[k]!==before[k]).map(k=>{
    const d=s[k]-before[k];
    return '<span class="delta '+(d>0?'up':'down')+'">'+STAT_NAMES[k]+' '+(d>0?'+':'')+d+'</span>';
  }).join('');
  renderHUD();
  $('#stage').innerHTML=
  '<section class="card enter">'+
    '<div class="kicker">'+currentItem().stage+' · 你的选择</div>'+
    '<h1>'+ev.title+'</h1>'+
    '<div class="prose">'+c.res.split('\n').map(p=>'<p>'+p+'</p>').join('')+'</div>'+
    (deltas?'<div class="deltas">'+deltas+'</div>':'')+
    '<div class="drift"><span>性格的偏移</span><p>'+drift+'</p></div>'+
    '<button class="primary" id="nextBtn">'+(state.dead?'眼前一黑':'继续')+'</button>'+
  '</section>';
  $('#nextBtn').onclick=advance;
  goTop();
}

function advance(){
  if(state.dead){showEnding();return;}
  const item=currentItem();
  const ev=item?EVENTS[item.id]:null;
  if(ev&&(!ev.choices||!ev.choices.length)&&ev.autoEff){
    for(const [k,v] of Object.entries(ev.autoEff))state.stats[k]=clamp((state.stats[k]||0)+v);
  }
  state.pos+=1;
  if(state.pos>=state.plan.length){showEnding();return;}
  save();
  renderEvent();
}

/* ===================== 判定 ===================== */
function judge(){
  const s=state.stats,f=state.flags,t=mbti();
  const selfPath=f.selfStay||f.selfYunnan||f.selfStable;
  const selfBase=
    s.heart>=75&&s.career>=30&&s.ties>=50&&s.body>0&&state.kind>=6&&
    t.type==='ISTJ'&&selfPath&&f.figTree&&!f.lostSelf&&!f.crossedLine;
  if(f.crossedLine)return 'third';
  if(s.ties<40&&s.career>=30)return 'island';
  if(selfBase&&f.partner)return 'together';
  if(selfBase)return 'self';
  if(f.leftTown&&!selfPath)return 'far';
  if(!selfPath&&s.heart>=60&&s.career<30)return 'emptyroom';
  if(!selfPath)return 'idle';
  if(s.heart>=60&&s.career>=20)return 'almost';
  return 'weather';
}

function typeNote(type,id){
  const map={
    self:'你把 '+type+' 的稳，变成了自己的日子。',
    together:'你把 '+type+' 的稳，分了一半给另一个人。',
    almost:'你成了 '+type+'。你什么都想清楚了，只差一步。',
    weather:'你成了 '+type+'。你把日子过稳了。',
    far:'你成了 '+type+'。你换了一个地方，还是按自己的方式活。',
    emptyroom:'你成了 '+type+'。你给自己留了一间空房。',
    idle:'你成了 '+type+'。你什么都安排好了，除了自己想要什么。',
    third:'你成了 '+type+'。你在别人的故事里，丢了自己的边界。',
    island:'你成了 '+type+'。你什么都靠自己，后来也只剩自己。',
    lightout:'你成了 '+type+'。你把自己耗尽了。'
  };
  return map[id]||('你成了 '+type+'。');
}

/* ===================== 结局页 ===================== */
function showEnding(){
  const id=state.dead?'lightout':judge();
  state.ending=id;
  const isNew=unlockEnding(id);
  try{localStorage.removeItem(SAVE_KEY);}catch(e){}
  state.age=30;
  state.year=2026;
  renderHUD();
  const e=ENDINGS[id];
  const t=mbti();
  const stats=DELTA_ORDER.map(k=>{
    const v=Math.round(state.stats[k]);
    return '<div class="fstat"><em>'+STAT_NAMES[k]+'</em><b>'+v+'</b><i style="--p:'+v+'%"></i></div>';
  }).join('');
  $('#stage').innerHTML=
  '<section class="card ending enter">'+
    '<div class="kicker">第 '+state.run+' 世 · '+e.sub+'</div>'+
    '<h1 class="end-title">'+e.title+'</h1>'+
    '<div class="prose">'+e.prose.map(p=>'<p>'+p+'</p>').join('')+'</div>'+
    (e.quote?'<div class="quote">'+e.quote+'</div>':'')+
    '<div class="stamp">'+(isNew?'新结局已收录':'已收录')+'</div>'+
    '<div class="final-stats">'+stats+'</div>'+
    '<div class="persona"><h3>人格侧写</h3><div class="type">'+t.type+'</div>'+
      '<p>'+typeNote(t.type,id)+'</p></div>'+
    '<div class="chartfinal"><h3>余音</h3><p>'+CHART_NOTES[id]+'</p></div>'+
    '<div class="end-actions">'+
      '<button class="primary" id="againBtn">再来一世</button>'+
      '<div class="row">'+
        '<button class="ghost" id="copyBtn">复制这一世</button>'+
        '<button class="ghost" id="homeBtn">回到封面</button>'+
      '</div>'+
    '</div>'+
  '</section>';
  $('#againBtn').onclick=()=>{state=null;renderOrigins();};
  $('#copyBtn').onclick=()=>copyText(shareText());
  $('#homeBtn').onclick=()=>{state=null;renderTitle();};
  goTop();
}

function shareText(){
  const e=ENDINGS[state.ending];
  const s=state.stats;
  const t=mbti();
  const lines=[
    '《心灯》第'+state.run+'世',
    '结局：'+e.title,
    '人格：'+t.type,
    '心灯 '+s.heart+' · 韧性 '+s.grit+' · 生计 '+s.career+' · 人情 '+s.ties+' · 身体 '+s.body+' · 缘分 '+s.fate
  ];
  return lines.join('\n');
}

/* ===================== 弹窗 ===================== */
function openHelp(){
  showModal('<div class="modal-head"><h2>玩法</h2><p>慢慢选，不着急</p></div>'+
  '<div class="help">'+
    '<p>你走完这一生。每个选择都会改变一些东西。</p>'+
    '<p>心灯太低的时候，有些话你说不出口，选项会锁住。</p>'+
    '<p>进度自动保存在这台设备上。</p>'+
  '</div>');
}

function openGallery(){
  const got=loadEndings();
  const rows=GALLERY_ORDER.map((id,i)=>{
    const e=ENDINGS[id],ok=got.includes(id);
    return '<div class="g-row'+(ok?'':' off')+'">'+
      '<span class="g-i">'+String(i+1).padStart(2,'0')+'</span>'+
      '<div class="g-t"><b>'+(ok?e.title:'？？？')+'</b><span>'+(ok?e.sub:'尚未走到')+'</span></div>'+
    '</div>';
  }).join('');
  showModal('<div class="modal-head"><h2>结局图鉴</h2><p>'+got.length+' / 10</p></div><div class="gallery">'+rows+'</div>');
}

function openMenu(){
  showModal('<div class="modal-head"><h2>这一世</h2><p>第 '+(state?state.run:1)+' 世</p></div>'+
  '<div class="menu">'+
    '<button id="mHelp">玩法说明</button>'+
    '<button id="mGal">结局图鉴</button>'+
    '<button id="mHome">回到封面</button>'+
    '<button id="mRestart" class="danger">重新开始</button>'+
  '</div>');
  $('#mHelp').onclick=openHelp;
  $('#mGal').onclick=openGallery;
  $('#mHome').onclick=()=>{
    closeModal();
    if(state&&!state.ending)save();
    state=null;
    renderTitle();
  };
  $('#mRestart').onclick=()=>{
    showModal('<div class="modal-head"><h2>重新开始？</h2><p>这一世的进度会被清掉。</p></div>'+
    '<div class="menu"><button id="yesRestart" class="danger">确定重开</button><button id="noRestart">再想想</button></div>');
    $('#yesRestart').onclick=()=>{
      closeModal();
      try{localStorage.removeItem(SAVE_KEY);}catch(e){}
      state=null;
      renderOrigins();
    };
    $('#noRestart').onclick=closeModal;
  };
}

/* ===================== 弹窗 / 复制 ===================== */
function showModal(html){
  $('#modalBody').innerHTML=html;
  $('#modal').classList.remove('hidden');
}
function closeModal(){$('#modal').classList.add('hidden');}

let toastTimer=null;
function toast(t){
  const el=$('#toast');
  el.textContent=t;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}
async function copyText(t){
  try{
    await navigator.clipboard.writeText(t);
    toast('已复制');
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=t;
    ta.style.position='fixed';
    ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select();
    try{document.execCommand('copy');toast('已复制');}catch(err){toast('复制失败，请手动选择');}
    ta.remove();
  }
}

/* ===================== 启动 ===================== */
$('#menuBtn').onclick=openMenu;
$('#modalClose').onclick=closeModal;
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
renderTitle();

</script>
